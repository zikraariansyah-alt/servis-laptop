<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Staff - Zikra Service Laptop</title>

    <style>
        :root {
            --primary-color: #1e3a8a; 
            --secondary-color: #3b82f6; 
            --bg-gradient: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
        }

        * { box-sizing: border-box; }

        body {
            background: var(--bg-gradient);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
        }

        .login-card {
            width: 420px;
            border-radius: 20px;
            background: #ffffff;
            box-shadow: 0 10px 30px rgba(30, 58, 138, 0.1);
            padding: 40px;
        }

        .brand-logo {
            width: 60px;
            height: 60px;
            background: #eff6ff;
            color: var(--primary-color);
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            margin: 0 auto 15px auto;
            font-weight: bold;
        }

        .login-header { text-align: center; }

        .login-header h3 {
            font-weight: 800;
            color: var(--primary-color);
            margin-top: 0;
            margin-bottom: 6px;
            font-size: 1.6rem;
        }

        .login-header h5 {
            font-weight: 500;
            color: #64748b;
            font-size: 0.9rem;
            margin-top: 0;
            margin-bottom: 30px;
        }

        .form-label {
            font-weight: 600;
            color: #334155;
            font-size: 0.85rem;
            display: block;
            margin-bottom: 8px;
        }

        .input-group {
            display: flex;
            align-items: center;
            width: 100%;
        }

        .input-group-text {
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            border-right: none;
            color: #94a3b8;
            border-radius: 10px 0 0 10px;
            padding: 10px 15px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .form-control {
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 10px 15px;
            font-size: 0.95rem;
            color: #334155;
            height: 46px;
            width: 100%;
            outline: none;
        }

        .input-group .form-control {
            border-left: none;
            border-radius: 0 10px 10px 0;
        }

        .btn-login {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            font-size: 1rem;
            color: white !important;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="brand-logo">💻</div>

        <div class="login-header">
            <h3>PORTAL INTERNAL</h3>
            <h5>Khusus Pengelolaan Staf & Admin Toko</h5>
        </div>

        <!-- Diarahkan masuk ke dalam folder pages/dashboard.html admin -->
        <form action="pages/dashboard.html">
            <div class="mb-3">
                <label class="form-label">Username Staf</label>
                <div class="input-group">
                    <span class="input-group-text">👤</span>
                    <input type="text" class="form-control" placeholder="Masukkan username" required>
                </div>
            </div>

            <div class="mb-4" style="margin-bottom: 25px;">
                <label class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text">🔒</span>
                    <input type="password" class="form-control" placeholder="Masukkan password" required>
                </div>
            </div>

            <button type="submit" class="btn-login">
                Masuk ke Sistem Utama →
            </button>
        </form>
    </div>

</body>
</html>
