<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem Informasi Jasa Servis Laptop</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f5f6fa;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            width: 400px;
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .login-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .login-header h3 {
            font-weight: bold;
        }
        .login-header h5 {
            font-weight: bold;
        }

        .btn-login {
            width: 100%;
        }
    </style>
</head>

<body>

    <div class="card login-card p-4">

        <div class="login-header">
            <h3>SERVIS LAPTOP</h3>
            <h5>Sistem Informasi Jasa Service laptop</h5>
        </div>

        <form>
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" placeholder="Masukkan Username">
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" placeholder="Masukkan Password">
            </div>

            <a href="index.html" class="btn btn-primary btn-login">
                Login
            </a>
        </form>

    </div>

</body>
</html>
