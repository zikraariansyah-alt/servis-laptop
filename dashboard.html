<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Zikra Service Laptop</title>

    <!-- Memanggil file style luar murni -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- 1. Bagian Menu Sidebar Kiri -->
    <div class="sidebar">
        <div class="sidebar-brand">
            <h4>ZIKRA SERVICE</h4>
            <p>Sistem Informasi Jasa Servis</p>
        </div>
        <div class="nav-menu">
            <a class="nav-link active" href="dashboard.html">📊 Dashboard</a>
            <a class="nav-link" href="pelanggan.html">👥 Data Pelanggan</a>
            <a class="nav-link" href="teknisi.html">🪪 Data Teknisi</a>
            <a class="nav-link" href="servis.html">💻 Data Servis</a>
            <a class="nav-link" href="transaksi.html">💳 Transaksi</a>
            <a class="nav-link" href="laporan.html">📈 Laporan</a>
            <a class="nav-link nav-link-logout" href="index.html">🚪 Keluar (Logout)</a>
        </div>
    </div>

    <!-- 2. Bagian Konten Kanan -->
    <div class="main-content">
        <h2>Dashboard Ringkasan</h2>
        
        <div class="stat-grid">
            
            <div class="stat-card">
                <div>
                    <div class="stat-title">Total Servis</div>
                    <div class="stat-value">120</div>
                </div>
                <div class="stat-icon icon-total">💻</div>
            </div>

            <div class="stat-card">
                <div>
                    <div class="stat-title">Dalam Proses</div>
                    <div class="stat-value">18</div>
                </div>
                <div class="stat-icon icon-proses">⚙️</div>
            </div>

            <div class="stat-card">
                <div>
                    <div class="stat-title">Servis Selesai</div>
                    <div class="stat-value">97</div>
                </div>
                <div class="stat-icon icon-selesai">✅</div>
            </div>

            <div class="stat-card">
                <div>
                    <div class="stat-title">Pendapatan Bulan Ini</div>
                    <div class="stat-value" style="font-size: 1.35rem;">Rp8.500.000</div>
                </div>
                <div class="stat-icon icon-dana">💰</div>
            </div>

        </div>
    </div>

</body>

</html>
